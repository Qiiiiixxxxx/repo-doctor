[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-doctor"
version = "0.1.0"
description = "A zero-dependency CLI that audits the health of a Git repository"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["git", "cli", "repository", "lint", "health-check", "ci"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
repo-doctor = "repo_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["repo_doctor*"]
